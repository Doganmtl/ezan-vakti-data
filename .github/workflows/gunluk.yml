name: Günlük içerik

on:
  schedule:
    # Her gün 03:07 ve 07:37 (Türkiye saati). İkinci çalışma, ilki başarısız olursa diye.
    - cron: "7 0 * * *"
    - cron: "37 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veri-guncelleme
  cancel-in-progress: false

jobs:
  gunluk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Ağ isteğinden önce: testler başarısızsa içerik çekilmez, yayın yapılmaz.
      - name: Offline testler
        run: |
          for f in scripts/*.mjs; do node --check "$f"; done
          node --test test/*.test.mjs

      - name: Günün ayeti/hadisi/duası ve Cuma hutbesi
        id: cek
        run: node scripts/gunluk.mjs
        continue-on-error: true

      # Kısmi hata olsa da eski kayıtlar korunarak hazırlanan dosya doğrulanıp yayınlanır.
      - name: Doğrulanmış anlık görüntüyü yayınla
        run: bash scripts/publish-data.sh daily

      - name: Hata varsa bildir
        if: steps.cek.outcome == 'failure'
        run: |
          echo "Günlük içerik alınamadı (ayrıntı yukarıdaki adımda). Eski kayıtlar korundu."
          exit 1
