name: Vakitleri güncelle

on:
  schedule:
    # Pazartesi ve perşembe 04:17 (Türkiye saati) — kaynak 30 gün ileriyi verdiği için bol pay bırakır
    - cron: "17 1 * * 1,4"
  workflow_dispatch: {}   # Actions sekmesinden "Run workflow" ile elle de çalıştırılabilir

permissions:
  contents: write

concurrency:
  group: veri-guncelleme
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Ağ isteği ve kota tüketmeden önce: testler başarısızsa kaynak çağrılmaz, yayın yapılmaz.
      - name: Offline testler
        run: |
          for f in scripts/*.mjs; do node --check "$f"; done
          node --test test/*.test.mjs
          node scripts/eslesme-dogrula.mjs

      - name: Vakitleri çek ve doğrula
        run: node scripts/guncelle.mjs

      # Eski checkout, rerun, yanlış dal/olay ve eşzamanlı güncelleme korumaları publish-data.sh içinde.
      # Yalnız fast-forward push; pull/rebase, force veya çakışma üzerine yazma yok.
      - name: Doğrulanmış anlık görüntüyü yayınla
        run: bash scripts/publish-data.sh prayer
