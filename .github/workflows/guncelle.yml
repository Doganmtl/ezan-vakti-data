name: Vakitleri güncelle (resmi yıllık — DateRange)
# Plan A (9. tur, kullanıcı onaylı): resmi Awqat Salah API, awqat-uretim Environment, yalnız main.
# DateRange ve Monthly AYRI workflow'lar: her biri kendi kota okuması, D06 kararı, doğrulayıcı geçişi ve commit'i.
# D24 (kullanıcı kararı 28.11.2026): Diyanet kotası hizmet+parametre başına normal 10 hakla planlanır; ortak günlük HTTP
# tavanı yok (GUNLUK_ISTEK_TAVANI: yok). Kontrollü işlem grubu: en çok 100 ilçe, çalışma başına en çok 110 HTTP (giriş,
# Quota/My, yenileme, tekrarlar dahil). Bütün HTTP istekleri ve Diyanet kotası kalıcı `kota-defteri` dalına yazılır.
# D24 zamanlaması (kullanıcı onayıyla açılır): DateRange: 02:13, 10:13, 20:43 İstanbul. Elle tetikleme de sürer.
on:
  schedule:
    - cron: "13 23 * * *"
    - cron: "13 7 * * *"
    - cron: "43 17 * * *"
  workflow_dispatch:
    inputs:
      dilim:
        description: "Bu çalışmada en çok kaç ilçe (kontrollü grup; Diyanet parametre kotası ayrıca sınırlar)"
        required: true
        default: "100"

permissions:
  contents: write

concurrency:
  group: veri-guncelleme
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: awqat-uretim
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Ağ isteği ve kota tüketmeden önce: testler başarısızsa kaynak çağrılmaz, yayın yapılmaz.
      - name: Offline testler
        run: |
          for f in scripts/*.mjs scripts/resmi/*.mjs; do node --check "$f"; done
          node --test test/*.test.mjs
          node scripts/eslesme-dogrula.mjs

      - name: Gün (Europe/Istanbul)
        id: gun
        run: echo "gun=$(TZ=Europe/Istanbul date +%F)" >> "$GITHUB_OUTPUT"

      # D23: kalıcı defter dalı (operasyonel HTTP + Diyanet kota). Yoksa istek gönderilmez; sayaç sıfırlanmaz.
      - name: Defter dalını al
        run: bash scripts/defter-dali.sh al

      - name: Vakitleri çek ve doğrula (DateRange)
        env:
          VERI_KAYNAGI: resmi
          RESMI_UC: DateRange
          RESMI_KAYNAK_ONAYI: evet
          RESMI_TOPLAM_ISTEK_SINIRI: "110"
          GUNLUK_ISTEK_TAVANI: "yok"
          AWQAT_DEFTER: .defter/awqat.json
          AWQAT_KOTA_DEFTERI: .defter/awqat-kota.json
          KOTA_DEFTERI_ZORUNLU: evet
          DILIM_BOYUTU: ${{ inputs.dilim || '100' }}
          AWQAT_EMAIL: ${{ secrets.AWQAT_EMAIL }}
          AWQAT_PASSWORD: ${{ secrets.AWQAT_PASSWORD }}
        run: node scripts/guncelle.mjs

      # Başarısız ya da yarım çalışmanın istekleri de deftere yazılır.
      - name: Defteri kaydet
        if: always()
        run: bash scripts/defter-dali.sh kaydet

      # Eski checkout, rerun, yanlış dal/olay ve eşzamanlı güncelleme korumaları publish-data.sh içinde.
      # Yalnız fast-forward push; pull/rebase, force veya çakışma üzerine yazma yok.
      - name: Doğrulanmış anlık görüntüyü yayınla
        run: bash scripts/publish-data.sh prayer

      - name: Operasyon özeti
        if: always()
        env:
          AWQAT_DEFTER: .defter/awqat.json
        run: |
          node scripts/resmi/operasyon-raporu.mjs > ozet.txt || true
          grep -v '^OPERASYON_OZET ' ozet.txt >> "$GITHUB_STEP_SUMMARY" || true
          grep '^OPERASYON_OZET ' ozet.txt || true
