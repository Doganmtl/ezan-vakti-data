name: Awqat pilot (3 ilçe, 11 istek)
# Kullanıcının açık talebiyle (27.11.2026) tek seferlik kontrollü pilot. Yalnız bu dala push ile çalışır;
# main'e / PR #2'ye girmez. Yayına (docs/v1) ve depoya hiçbir şey yazmaz; rapor yalnız artifact olarak.
on:
  push:
    branches: [pilot/awqat-pilot]
permissions:
  contents: read
concurrency:
  group: awqat-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Offline testler (başarısızsa API'ye istek gitmez)
        run: |
          for f in scripts/*.mjs scripts/resmi/*.mjs; do node --check "$f"; done
          node --test test/*.test.mjs
          node scripts/eslesme-dogrula.mjs
      - name: Pilot (en çok 11 istek, tekrar yok)
        env:
          ALLOW_LIVE_API: evet
          AWQAT_EMAIL: ${{ secrets.AWQAT_EMAIL }}
          AWQAT_PASSWORD: ${{ secrets.AWQAT_PASSWORD }}
          GOLGE_DIR: golge
        run: |
          set +e
          node scripts/resmi/pilot.mjs
          kod=$?
          echo "pilot_cikis=$kod"
          exit 0
      - name: Rapor özeti (gizli bilgi içermez)
        if: always()
        run: |
          f=$(ls golge/pilot-*.json 2>/dev/null | head -1)
          [ -n "$f" ] && node -e '
            const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
            console.log(JSON.stringify({sonuc:r.sonuc,durdu:r.durdu??null,hata:r.hata??null,kriterler:r.kriterler,istek:r.istek,
              turkiye:r.turkiye,adimlar:r.adimlar,ilceler:Object.fromEntries(Object.entries(r.ilceler).map(([k,v])=>[k,{resmi:v.resmi,ad:v.ad,ayniKimlik:v.ayniKimlik,gun:v.gun,ilk:v.ilk,son:v.son,bugunArti14:v.bugunArti14,eksikAlan:v.eksikAlan,ornekAlanlar:v.ornekAlanlar,ortakGun:v.karsilastirma?.ortakGun,fark:v.karsilastirma?.fark?.slice(0,10)}])),
              kotaOnce:r.kotaOnce,kotaSonra:r.kotaSonra},null,1));' "$f" || echo "Rapor oluşmadı."
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: awqat-pilot-raporu
          path: golge/
          retention-days: 7
          if-no-files-found: ignore
