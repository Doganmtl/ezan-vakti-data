name: Offline data tests
on:
  pull_request:
    branches: [develop, 'feature/**']
    paths: ['scripts/**', 'test/**', 'eslesme/**', 'config/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          for f in scripts/*.mjs scripts/resmi/*.mjs; do [ -f "$f" ] && node --check "$f"; done
          node --test test/*.test.mjs
          node scripts/eslesme-dogrula.mjs
