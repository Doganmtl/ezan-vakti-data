name: Offline data tests
on:
  pull_request:
    branches: [develop]
    paths: ['scripts/**', 'test/**', '.github/workflows/offline-tests.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/guncelle.mjs && node --check scripts/gunluk.mjs && node --test test/*.test.mjs
